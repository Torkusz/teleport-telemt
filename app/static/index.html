<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>telemt panel</title>
<style>
:root{
  --bg0:#0b1220; --bg1:#132038; --glass:rgba(255,255,255,.08); --glass2:rgba(255,255,255,.12);
  --stroke:rgba(255,255,255,.14); --stroke2:rgba(255,255,255,.22);
  --ink:#f4f7fb; --muted:rgba(244,247,251,.62); --soft:rgba(255,255,255,.06);
  --accent:#5eead4; --accent2:#38bdf8; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --shadow:0 20px 50px rgba(0,0,0,.35); --r:18px; --r2:12px;
  --sans:ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --blur:blur(22px) saturate(1.35);
}
@media (prefers-color-scheme: light){
  :root{
    --bg0:#dbe7f3; --bg1:#c5d8ef; --glass:rgba(255,255,255,.55); --glass2:rgba(255,255,255,.72);
    --stroke:rgba(15,30,50,.12); --stroke2:rgba(15,30,50,.2);
    --ink:#0f1b2d; --muted:rgba(15,27,45,.58); --soft:rgba(255,255,255,.45);
    --accent:#0d9488; --accent2:#0284c7; --ok:#059669; --warn:#d97706; --bad:#e11d48;
    --shadow:0 18px 40px rgba(30,60,90,.12);
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font:15px/1.45 var(--sans); color:var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(56,189,248,.25), transparent 55%),
    radial-gradient(900px 500px at 90% 0%, rgba(94,234,212,.2), transparent 50%),
    radial-gradient(800px 500px at 50% 100%, rgba(167,139,250,.15), transparent 45%),
    linear-gradient(160deg,var(--bg0),var(--bg1));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{
  cursor:pointer; border:1px solid var(--stroke); background:var(--glass);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  padding:9px 14px; border-radius:999px; transition:.18s ease;
}
button:hover{border-color:var(--stroke2); background:var(--glass2)}
button.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#042f2e; border:0; font-weight:600; box-shadow:0 8px 24px rgba(56,189,248,.25);
}
button.primary:hover{filter:brightness(1.05)}
button.danger{color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%, transparent)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
input,select,textarea{
  width:100%; border:1px solid var(--stroke); background:var(--soft);
  border-radius:var(--r2); padding:10px 12px; backdrop-filter:blur(8px);
}
label{display:block; margin:0 0 12px; color:var(--muted); font-size:13px}
label input,label select,label textarea{margin-top:5px; color:var(--ink); font-size:15px}
label.inline{display:flex; gap:8px; align-items:center}
label.inline input{width:auto; margin:0}
.hint{color:var(--muted); font-size:13px; margin:-4px 0 12px}
.mono{font-family:var(--mono); font-size:12px; word-break:break-all}

.shell{max-width:1100px; margin:0 auto; padding:18px 16px 48px}
header.top{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:14px 18px; margin-bottom:18px;
  background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke); border-radius:var(--r); box-shadow:var(--shadow);
}
header.top h1{margin:0; font-size:17px; font-weight:650; letter-spacing:-.02em; flex:1}
header.top .ver{color:var(--muted); font-size:12px}

.glass{
  background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke); border-radius:var(--r); box-shadow:var(--shadow);
}
.panel{padding:18px; margin-bottom:16px}
.grid{display:grid; gap:14px}
@media(min-width:720px){.grid.two{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid.cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}}

.card{
  padding:16px; border-radius:var(--r); border:1px solid var(--stroke);
  background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  cursor:pointer; transition:.2s;
}
.card:hover{border-color:var(--stroke2); transform:translateY(-1px)}
.card .port{font-size:28px; font-weight:700; letter-spacing:-.03em}
.card .meta{color:var(--muted); font-size:13px; margin-top:4px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.spacer{flex:1}

.led{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--muted); margin-right:7px; vertical-align:1px}
.led.ok{background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 28%,transparent)}
.led.warn{background:var(--warn)} .led.bad{background:var(--bad)}

.pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600;
  background:var(--soft); border:1px solid var(--stroke);
}
.pill.web{color:var(--accent2); border-color:color-mix(in srgb,var(--accent2) 40%,transparent)}
.pill.tls{color:var(--accent)}

.empty{text-align:center; padding:48px 20px}
.empty h2{margin:0 0 8px; font-size:22px; letter-spacing:-.02em}
.empty p{color:var(--muted); max-width:460px; margin:0 auto 20px}

.overlay{
  position:fixed; inset:0; z-index:20;
  background:rgba(6,12,24,.45); backdrop-filter:blur(8px);
  display:flex; justify-content:flex-end;
}
.overlay.center{justify-content:center; align-items:center; padding:16px}
.drawer{
  width:min(640px,100%); height:100%; overflow:auto; padding:20px 18px 40px;
  background:var(--glass2); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-left:1px solid var(--stroke); box-shadow:var(--shadow);
}
.dialog{
  width:min(480px,94vw); max-height:92vh; overflow:auto; padding:22px;
  background:var(--glass2); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke); border-radius:22px; box-shadow:var(--shadow);
}
.drawer h2,.dialog h2{margin:0 0 4px; font-size:20px; letter-spacing:-.02em}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--stroke); margin:14px 0 16px; overflow:auto}
.tabs button{border:0; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--muted); padding:10px 12px; white-space:nowrap}
.tabs button.on{color:var(--ink); border-color:var(--accent)}

.user{
  border:1px solid var(--stroke); border-radius:var(--r2); padding:12px; margin-bottom:10px;
  background:var(--soft);
}
.user .name{font-weight:650}
.user .link{font-family:var(--mono); font-size:12px; word-break:break-all; color:var(--muted); margin:8px 0; padding:8px; border-radius:8px; background:rgba(0,0,0,.15)}

.check{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--stroke)}
.check:last-child{border:0}
.check b{display:block}

pre.log{
  background:rgba(0,0,0,.35); color:#c8d8d6; font:12px/1.4 var(--mono);
  padding:12px; border-radius:12px; max-height:55vh; overflow:auto; white-space:pre-wrap; word-break:break-all;
  border:1px solid var(--stroke);
}
pre.cfg{
  background:rgba(0,0,0,.3); color:#d1e7e4; font:12px/1.45 var(--mono);
  padding:12px; border-radius:12px; max-height:40vh; overflow:auto; white-space:pre-wrap;
  border:1px solid var(--stroke);
}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--bg0); padding:11px 18px; border-radius:999px;
  z-index:40; box-shadow:var(--shadow); max-width:90vw; text-align:center;
}
.toast.err{background:var(--bad); color:#fff}

.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
.login{
  width:min(380px,100%); padding:28px; border-radius:24px;
  background:var(--glass2); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke); box-shadow:var(--shadow);
}
.login h1{margin:0 0 6px; font-size:22px}
.steps{display:grid; gap:10px; margin:14px 0}
.step{
  display:flex; gap:12px; align-items:flex-start; padding:12px; border-radius:14px;
  background:var(--soft); border:1px solid var(--stroke);
}
.step .n{
  width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  font-size:12px; font-weight:700; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#042f2e; flex-shrink:0;
}
.drop{
  border:1.5px dashed var(--stroke2); border-radius:14px; padding:22px; text-align:center;
  color:var(--muted); background:var(--soft); cursor:pointer;
}
.drop.over{border-color:var(--accent); color:var(--ink)}
.progress{height:4px; background:var(--soft); border-radius:99px; overflow:hidden; margin-top:8px}
.progress>i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s}

@media(max-width:700px){
  .hide-s{display:none}
  .card .port{font-size:22px}
  header.top{padding:12px 14px}
  .drawer{width:100%}
}
@media(prefers-reduced-motion:no-preference){
  .led.ok{transition:box-shadow .3s}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $app = document.getElementById('app');
let S = null, openId = null, tab = 'users', poll = null, logTimer = null, presets = [];

function h(tag, a, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(a||{})){
    if (k==='class') e.className = v;
    else if (k==='html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k,'');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
async function api(method, url, body){
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json','X-Requested-With':'panel'}, body: body?JSON.stringify(body):undefined});
  if (r.status === 401 && url !== '/api/login'){ showLogin(); throw new Error('login'); }
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : (d.detail?.[0]?.msg || 'Ошибка '+r.status));
  return d;
}
function toast(msg, err){
  const t = h('div',{class:'toast'+(err?' err':'')}, msg);
  document.body.append(t); setTimeout(()=>t.remove(), 3200);
}
async function act(fn, ok){ try{ await fn(); if (ok) toast(ok); await refresh(); }catch(e){ if (e.message!=='login') toast(e.message,true); } }
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('Скопировано'); }
  catch{ toast('Не удалось скопировать', true); }
}
function fmtB(n){ if(!n) return '0 B'; const u=['B','KB','MB','GB']; let i=0; let x=n; while(x>=1024&&i<u.length-1){x/=1024;i++} return x.toFixed(i?1:0)+' '+u[i]; }
function ledOf(i){
  if(!i.enabled) return ['','выкл'];
  if(i.status?.running && i.status?.api) return ['ok','онлайн'];
  if(i.status?.running) return ['warn','старт…'];
  return ['bad','стоп'];
}

function showLogin(){
  clearInterval(poll); poll=null;
  const pw = h('input',{type:'password', placeholder:'пароль панели', autocomplete:'current-password'});
  const go = async()=>{ try{ await api('POST','/api/login',{password:pw.value}); await start(); }catch(e){ toast(e.message,true);} };
  pw.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  $app.replaceChildren(h('div',{class:'login-wrap'}, h('div',{class:'login'},
    h('h1',{},'telemt panel'),
    h('p',{class:'hint'},'Вход только с localhost / SSH-туннеля'),
    h('label',{},'Пароль', pw),
    h('div',{class:'row',style:'margin-top:8px'}, h('button',{class:'primary',onclick:go},'Войти'))
  )));
  setTimeout(()=>pw.focus(), 50);
}

function render(){
  if(!S) return;
  const root = h('div',{class:'shell'});
  root.append(h('header',{class:'top'},
    h('h1',{},'telemt'),
    h('span',{class:'ver'}, S.settings?.detected_host || ''),
    h('button',{onclick:()=>systemDialog()},'Система'),
    h('button',{onclick:()=>webWizard()},'WEB-прокси'),
    h('button',{onclick:()=>instanceDialog()},'+ FakeTLS'),
    h('button',{onclick:()=>cascadeHelp()},'Каскад / exit'),
    h('button',{class:'ghost',onclick:()=>act(()=>api('POST','/api/logout'),null).then(showLogin)},'Выйти')
  ));

  const main = h('div',{});
  root.append(main);

  if(!S.instances.length){
    main.append(h('div',{class:'glass panel empty'},
      h('h2',{},'Нет инстансов'),
      h('p',{},'Создайте WEB-прокси (рекомендуется) или классический FakeTLS. WEB маскируется под обычный сайт на 443.'),
      h('div',{class:'row',style:'justify-content:center'},
        h('button',{class:'primary',onclick:webWizard},'Создать WEB-прокси'),
        h('button',{onclick:()=>instanceDialog()},'FakeTLS')
      )
    ));
  } else {
    const cards = h('div',{class:'grid cards'});
    for(const i of S.instances){
      const [cls,txt] = ledOf(i);
      const isWeb = (i.transport||'tls')==='web';
      const conns = i.users.reduce((a,u)=>a+u.connections,0);
      cards.append(h('div',{class:'card',tabindex:0,onclick:()=>openInstance(i.id),onkeydown:e=>{if(e.key==='Enter')openInstance(i.id)}},
        h('div',{class:'row'},
          h('span',{}, h('span',{class:'led '+cls}), txt),
          h('span',{class:'spacer'}),
          i.cascade_active ? h('span',{class:'pill web'}, i.upstream_tunnel ? ('каскад · ssh '+(i.tunnel?i.tunnel.up_count+'/'+i.tunnel.total:'')+((i.tunnel&&i.tunnel.up_count===i.tunnel.total)?'':' ⚠')) : 'каскад') : null,
          h('span',{class:'pill '+(isWeb?'web':'tls')}, isWeb?'WEB':'FakeTLS')
        ),
        h('div',{class:'port',style:'margin-top:10px'}, isWeb ? '443' : i.port),
        h('div',{class:'meta'}, i.name),
        h('div',{class:'meta'}, isWeb
          ? ((i.web_base_path?('/'+i.web_base_path+' · '):'')+(i.cascade_active?('exit '+i.upstream_host+' · '):'')+'loopback '+(i.web_listen_port||'?'))
          : ((i.cascade_active?('exit '+i.upstream_host+' · '):'')+i.sni+' · MSS '+(i.mss||'авто'))),
        h('div',{class:'row',style:'margin-top:12px'},
          h('span',{class:'meta'},'онлайн '+conns),
          h('span',{class:'spacer'}),
          h('span',{class:'meta'},'всего '+i.stats.connections_total)
        )
      ));
    }
    main.append(cards);
  }

  // Caddy strip
  const c = S.caddy || {};
  main.append(h('div',{class:'glass panel',style:'margin-top:8px'},
    h('div',{class:'row'},
      h('b',{},'Caddy / TLS'),
      h('span',{class:'spacer'}),
      h('span',{class:'pill'}, c.port_443_open ? '443 открыт' : '443 закрыт'),
      h('button',{onclick:()=>caddyDialog()},'Настроить')
    ),
    h('p',{class:'hint',style:'margin:10px 0 0'},
      c.binary
        ? ('Caddy: '+(c.version||c.binary))
        : 'Caddy на хосте не найден — скачайте Caddyfile и запустите сами, либо установите caddy в PATH.'
    )
  ));

  $app.replaceChildren(root);
  const typing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#drawer-layer') && ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
  if (openId != null && !typing) drawDrawer();
}

function openInstance(id){ openId = id; tab = 'users'; drawDrawer(); }
function closeDrawer(){ openId = null; clearInterval(logTimer); document.getElementById('drawer-layer')?.remove(); }
function drawDrawer(){
  clearInterval(logTimer);
  const i = S.instances.find(x=>x.id===openId);
  if(!i){ closeDrawer(); return; }
  document.getElementById('drawer-layer')?.remove();
  const body = h('div',{});
  const layer = h('div',{class:'overlay',id:'drawer-layer',onclick:e=>{if(e.target===layer)closeDrawer()}},
    h('div',{class:'drawer',role:'dialog'},
      h('div',{class:'row'},
        h('div',{},
          h('h2',{},i.name),
          h('div',{class:'hint',style:'margin:0'}, (i.transport==='web'?'WEB · ':'FakeTLS · ')+ledOf(i)[1])
        ),
        h('span',{class:'spacer'}),
        h('button',{onclick:closeDrawer},'✕')
      ),
      h('div',{class:'tabs'},
        ...['users','diag','logs','cfg'].map(t=>{
          const labels={users:'Пользователи',diag:'Диагностика',logs:'Логи',cfg:'Настройки'};
          return h('button',{class:tab===t?'on':'',onclick:()=>{tab=t; drawDrawer();}}, labels[t]);
        })
      ),
      body
    )
  );
  document.body.append(layer);
  if(tab==='users') usersTab(body,i);
  else if(tab==='diag') diagTab(body,i);
  else if(tab==='logs') logsTab(body,i);
  else cfgTab(body,i);
}

function usersTab(body,i){
  const isWeb = (i.transport||'tls') === 'web';
  if (isWeb) {
    body.append(h('div',{class:'step',style:'margin-bottom:14px'},
      h('div',{class:'n'},'W'),
      h('div',{},
        h('b',{},'WEB-режим'),
        h('div',{class:'hint',style:'margin:4px 0 0'},
          `Telemt на 127.0.0.1:${i.web_listen_port}. Снаружи — Caddy на 443. Клиенты: Desktop 7.1+, свежий Android.`
        )
      )
    ));
  }
  for (const u of i.users){
    body.append(h('div',{class:'user'},
      h('div',{class:'row'}, h('span',{class:'name',style:'flex:1'},u.name), h('span',{class:'hint',style:'margin:0'},`онлайн ${u.connections} · IP ${u.ips} · ${fmtB(u.octets)}`)),
      h('div',{class:'link'},u.link),
      !u.link_from_api && h('div',{class:'hint'},'Ссылка собрана панелью — если не работает, подождите минуту.'),
      h('div',{class:'row'},
        h('button',{class:'primary',onclick:()=>copy(u.link)}, isWeb?'Копировать webproxy':'Копировать tg://'),
        h('button',{onclick:()=>copy(u.web_link)}, 't.me'),
        h('button',{onclick:()=>confirm('Новый секрет? Старая ссылка умрёт.')&&act(()=>api('POST',`/api/instances/${i.id}/users/${encodeURIComponent(u.name)}/rotate`),'Секрет обновлён')},'Новый секрет'),
        h('button',{class:'danger',onclick:()=>confirm('Удалить '+u.name+'?')&&act(()=>api('DELETE',`/api/instances/${i.id}/users/${encodeURIComponent(u.name)}`),'Удалён')},'Удалить')
      )
    ));
  }
  const nm = h('input',{placeholder:'имя, например anna',maxlength:64});
  body.append(h('div',{class:'row'}, nm, h('button',{onclick:()=>nm.value&&act(()=>api('POST',`/api/instances/${i.id}/users`,{name:nm.value}),'Добавлен')},'Добавить')));
}

async function diagTab(body,i){
  body.append(h('p',{class:'hint'},'Проверяем…'));
  try{
    const d = await api('GET',`/api/instances/${i.id}/diagnostics`);
    body.replaceChildren(...d.checks.map(c=>h('div',{class:'check'},
      h('span',{class:'led '+({ok:'ok',warn:'warn',bad:'bad'}[c.level]||'')}),
      h('div',{}, h('b',{},c.title), h('span',{class:'hint',style:'margin:0'},c.detail))
    )), h('button',{onclick:()=>drawDrawer(),style:'margin-top:12px'},'Проверить снова'));
  }catch(e){ if(e.message!=='login') body.replaceChildren(h('p',{},e.message)); }
}

function logsTab(body,i){
  const pre = h('pre',{class:'log'},'…'); body.append(pre);
  const load = async()=>{ try{ const d=await api('GET',`/api/instances/${i.id}/logs`); const stick=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-30; pre.textContent=d.lines.join('\n')||'Логов пока нет'; if(stick)pre.scrollTop=pre.scrollHeight; }catch{} };
  load(); logTimer=setInterval(load,3000);
}

function cfgTab(body,i){
  const f = formFields(i);
  body.append(f.el, h('div',{class:'row',style:'margin-top:8px'},
    h('button',{class:'primary',onclick:()=>act(async()=>{await api('PATCH','/api/instances/'+i.id,f.get());},'Сохранено')},'Сохранить'),
    h('button',{onclick:()=>act(()=>api('POST',`/api/instances/${i.id}/restart`),'Перезапущен')},'Рестарт'),
    h('button',{class:'danger',onclick:()=>confirm('Удалить инстанс?')&&act(async()=>{await api('DELETE','/api/instances/'+i.id);closeDrawer();},'Удалён')},'Удалить')
  ));
}

function formFields(i){
  const v = i||{port:443,sni:'www.cloudflare.com',mss:'tspu',middle_proxy:false,ad_tag:'',mask_host:'',mask_port:443,enabled:true,name:'',transport:'tls',web_base_path:'',web_site:'default',cascade_enabled:false,upstream_type:'socks5',upstream_host:'',upstream_port:1080,upstream_user:'',upstream_pass:'',upstream_tunnel:true,ssh_port:22,ssh_user:'telemt-tunnel',exits:[]};
  const name=h('input',{value:v.name||'',placeholder:'необязательно',maxlength:40});
  const transport=h('select',{}, h('option',{value:'tls'},'FakeTLS (ee)'), h('option',{value:'web'},'WEB (tg://webproxy)'));
  transport.value = v.transport || 'tls';
  const port=h('input',{type:'number',min:1,max:65535,value:v.port||443});
  const sni=h('input',{value:v.sni||'',placeholder:'www.cloudflare.com'});
  const basePath=h('input',{value:v.web_base_path||'',placeholder:'пусто = весь домен'});
  const siteSel=h('select',{});
  const sites = S?.sites || [{id:'default'}];
  for(const s of sites) siteSel.append(h('option',{value:s.id}, s.id+(s.has_index?'':' (нет index)')));
  siteSel.value = v.web_site || 'default';
  const mssSel=h('select',{}, h('option',{value:'tspu'},'tspu (рекомендуется)'), h('option',{value:''},'Выкл'), h('option',{value:'custom'},'Своё'));
  const mssNum=h('input',{type:'number',min:40,max:1460,placeholder:'88'});
  if (v.mss==='tspu') mssSel.value='tspu'; else if (!v.mss) mssSel.value=''; else { mssSel.value='custom'; mssNum.value=v.mss; }
  const syncM=()=>{mssNum.style.display=mssSel.value==='custom'?'':'none'}; mssSel.addEventListener('change',syncM); syncM();
  const mm=h('input',{type:'checkbox',checked:!!v.middle_proxy});
  const ad=h('input',{value:v.ad_tag||'',placeholder:'32 hex'});
  const mh=h('input',{value:v.mask_host||'',placeholder:'пусто = SNI'});
  const mp=h('input',{type:'number',value:v.mask_port||443});
  const en=h('input',{type:'checkbox',checked:v.enabled!==false});
  // cascade
  const cas=h('input',{type:'checkbox',checked:!!v.cascade_enabled});
  const tun=h('input',{type:'checkbox',checked:v.upstream_tunnel!==false});
  // --- прямой SOCKS5 (без туннеля): один exit с логином/паролем
  const uh=h('input',{value:v.upstream_host||'',placeholder:'IP зарубежного VPS'});
  const up=h('input',{type:'number',min:1,max:65535,value:v.upstream_port||1080});
  const uu=h('input',{value:v.upstream_user||'',placeholder:'telemt'});
  const uw=h('input',{value:v.upstream_pass||'',placeholder:'пароль SOCKS'});
  const directBox=h('div',{class:'grid two'},
    h('label',{},'Exit host (IP)',uh), h('label',{},'SOCKS порт',up),
    h('label',{},'SOCKS user',uu), h('label',{},'SOCKS pass',uw));
  // --- SSH-туннели: список exit'ов (по туннелю на каждый, telemt балансирует по weight)
  const newExit=()=>({host:'',ssh_port:22,ssh_user:'telemt-tunnel',socks_port:1080,weight:10,enabled:true});
  const exits=((v.exits&&v.exits.length)?v.exits:[newExit()]).map(e=>({...e}));
  const exitsBox=h('div',{});
  const numIn=(e,k,w,title)=>{const x=h('input',{type:'number',min:1,max:65535,value:e[k],title,style:'width:'+w+'px'}); x.addEventListener('input',()=>{e[k]=+x.value||0}); return x;};
  function renderExits(){
    exitsBox.replaceChildren(...exits.map((e,idx)=>{
      const en=h('input',{type:'checkbox',checked:e.enabled!==false,title:'использовать этот exit'}); en.addEventListener('change',()=>{e.enabled=en.checked});
      const host=h('input',{value:e.host||'',placeholder:'IP exit',style:'flex:1;min-width:120px'}); host.addEventListener('input',()=>{e.host=host.value});
      const su=h('input',{value:e.ssh_user||'',title:'SSH user на exit',style:'width:110px'}); su.addEventListener('input',()=>{e.ssh_user=su.value});
      let st='';
      if(e._check) st=e._check.ok?('✓ до Telegram '+e._check.ms+' мс'):('✗ '+e._check.error);
      else if(v.id && v.cascade_active && e.idx!==undefined && e.enabled!==false) st=e.up?'● туннель поднят':'○ туннель не поднят';
      return h('div',{style:'display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0'},
        en, host,
        h('span',{class:'hint'},'ssh'), numIn(e,'ssh_port',64,'SSH порт exit'), su,
        h('span',{class:'hint'},'socks'), numIn(e,'socks_port',64,'порт SOCKS на exit (localhost)'),
        h('span',{class:'hint'},'вес'), numIn(e,'weight',52,'weight 1–100: доля новых соединений'),
        st?h('span',{class:'hint',style:'min-width:90px'},st):null,
        h('button',{type:'button',onclick:()=>cascadeHelp(null,true,{port:e.socks_port||1080,ssh_user:(e.ssh_user||'').trim()||'telemt-tunnel'})},'Скрипт'),
        exits.length>1?h('button',{type:'button',title:'убрать exit',onclick:()=>{exits.splice(idx,1);renderExits()}},'✕'):null
      );
    }));
  }
  renderExits();
  const addBtn=h('button',{type:'button',onclick:()=>{ if(exits.length>=8) return toast('Не больше 8 exit\'ов',true); exits.push(newExit()); renderExits(); }},'+ Добавить exit');
  const checkBtn=v.id?h('button',{type:'button',onclick:async()=>{
    try{
      const r=await api('POST','/api/instances/'+v.id+'/exits/check');
      const by={}; r.results.forEach(x=>{by[x.idx]=x});
      exits.forEach(e=>{e._check=(e.idx!==undefined&&by[e.idx])||null});
      renderExits();
      if(!r.results.length) toast('Нет активных exit\'ов: сохраните настройки и включите каскад',true);
    }catch(err){ toast(err.message||String(err),true); }
  }},'Проверить exits'):null;
  const resetBtn=v.id?h('button',{type:'button',onclick:()=>act(async()=>{await api('POST','/api/instances/'+v.id+'/tunnel/reset-hostkey');},'Ключи хостов сброшены, туннели перезапущены')},'Сбросить ключи хостов'):null;
  const tn=v.tunnel;
  const tunStatus=h('p',{class:'hint'});
  if(v.id && v.cascade_active && v.upstream_tunnel && tn){
    tunStatus.textContent='Туннели: подняты '+tn.up_count+' из '+tn.total+(tn.up_count<tn.total?' — смотрите строки [tunnel] в логах инстанса':'');
    if(tn.up_count<tn.total) tunStatus.style.color='var(--danger, #e5484d)';
  }
  const exitsWrap=h('div',{},
    h('p',{class:'hint'},'Для каждого exit панель держит свой SSH-туннель. Telemt распределяет новые соединения по весу (10:10:5 → 40%/40%/20%). Выполните «Скрипт» на каждом зарубежном VPS.'),
    tunStatus, exitsBox,
    h('div',{class:'row',style:'margin-top:6px;gap:8px;flex-wrap:wrap'}, addBtn, checkBtn, resetBtn)
  );
  const cascadeBox=h('div',{style:'margin-top:10px;padding:12px;border:1px solid var(--stroke);border-radius:var(--r2);background:var(--soft)'},
    h('label',{class:'inline'},cas,'Каскад: РФ → зарубежные SOCKS5 (exit\'ы)'),
    h('p',{class:'hint'},'Клиенты ходят на этот сервер (WEB). До Telegram трафик уходит через exit. Ссылка не меняется при смене/добавлении exit.'),
    h('label',{class:'inline'},tun,'SSH-туннели до exit (рекомендуется)'),
    h('p',{class:'hint'},'Открытый SOCKS5 через границу может молча резаться (CONNECT на IP Telegram зависает). Внутри SSH этого не видно, SOCKS на exit слушает только localhost.'),
    exitsWrap, directBox,
    h('div',{class:'row',style:'margin-top:6px'},
      h('button',{type:'button',onclick:()=>cascadeHelp(v.id,tun.checked,{port:+up.value||1080,ssh_user:'telemt-tunnel'})},'Скрипт для зарубежного VPS')
    )
  );
  const syncCas=()=>{
    const on=cas.checked, t=tun.checked;
    tun.disabled=!on;
    exitsWrap.style.display=t?'':'none';
    directBox.style.display=t?'none':'';
    uh.disabled=up.disabled=uu.disabled=uw.disabled=!on||t;
  };
  cas.addEventListener('change',syncCas); tun.addEventListener('change',syncCas); syncCas();
  const tlsBox=h('div',{}, h('label',{},'Порт',port), h('label',{},'SNI',sni),
    h('label',{},'ClientHello MSS',mssSel,mssNum),
    h('details',{}, h('summary',{style:'cursor:pointer;color:var(--muted);margin-bottom:8px'},'Дополнительно'),
      h('label',{class:'inline'},mm,'middle-proxy'), h('label',{},'ad_tag',ad), h('label',{},'mask_host',mh), h('label',{},'mask_port',mp)
    )
  );
  const webBox=h('div',{},
    h('p',{class:'hint'},'Публично всегда 443. Caddy терминирует TLS и проксирует на telemt.'),
    h('label',{},'Путь на сайте (base_path)',basePath),
    h('label',{},'Сайт-прикрытие (decoy)',siteSel)
  );
  const syncT=()=>{ const w=transport.value==='web'; tlsBox.style.display=w?'none':''; webBox.style.display=w?'':'none'; };
  transport.addEventListener('change',syncT); syncT();
  const el=h('div',{},
    h('label',{},'Название',name),
    h('label',{},'Тип',transport),
    tlsBox, webBox,
    cascadeBox,
    h('label',{class:'inline'},en,'Включён')
  );
  return {el, get:()=>({
    name:name.value, port:+port.value||443, sni:sni.value.trim()||'www.cloudflare.com',
    mss:mssSel.value==='custom'?String(mssNum.value):mssSel.value,
    middle_proxy:mm.checked, ad_tag:ad.value.trim(), mask_host:mh.value.trim(), mask_port:+mp.value||443,
    enabled:en.checked, transport:transport.value,
    web_base_path:basePath.value.trim(), web_site:siteSel.value, web_decoy_upstream:'',
    cascade_enabled:cas.checked, upstream_type:'socks5',
    upstream_host:uh.value.trim(), upstream_port:+up.value||1080,
    upstream_user:uu.value.trim(), upstream_pass:uw.value,
    upstream_tunnel:tun.checked,
    exits:exits.filter(e=>(e.host||'').trim()).map(e=>({host:e.host.trim(), ssh_port:+e.ssh_port||22, ssh_user:(e.ssh_user||'').trim()||'telemt-tunnel', socks_port:+e.socks_port||1080, weight:+e.weight||10, enabled:e.enabled!==false}))
  })};
}

async function cascadeHelp(iid, tunnel=true, opts={}){
  try{
    let data;
    if(iid && !tunnel){
      data = await api('GET', `/api/instances/${iid}/cascade/script?tunnel=0`);
    } else {
      data = await api('POST','/api/cascade/exit-script',{upstream_port:opts.port||1080, tunnel, ssh_user:opts.ssh_user||'telemt-tunnel'});
    }
    const pre = h('pre',{class:'log',style:'max-height:280px;white-space:pre-wrap'}, data.script);
    const info = data.tunnel
      ? `SSH-туннель: user=${data.ssh_user}  SOCKS на exit: 127.0.0.1:${data.upstream_port} (только localhost)`
      : `user=${data.upstream_user}  pass=${data.upstream_pass}  port=${data.upstream_port}`;
    const hint = data.tunnel
      ? '1) Скопируйте скрипт на зарубежный сервер и выполните от root (он добавит ключ панели и поднимет SOCKS на localhost). 2) Из вывода впишите IP и SSH порт, включите «SSH-туннель», сохраните. Панель сама поднимет туннель. Ссылка WEB для клиентов не меняется.'
      : '1) Скопируйте скрипт на зарубежный сервер и выполните от root. 2) IP из вывода впишите в «Exit host». 3) Сохраните инстанс. Ссылка WEB для клиентов не меняется.';
    const layer = h('div',{class:'overlay center',onclick:e=>{if(e.target===layer)layer.remove()}},
      h('div',{class:'dialog',style:'width:min(640px,96vw)'},
        h('h2',{},'Развёртка exit (зарубежный VPS)'),
        h('p',{class:'hint'},hint),
        h('div',{class:'mono',style:'margin-bottom:8px'},info),
        pre,
        h('div',{class:'row',style:'margin-top:12px'},
          h('button',{class:'primary',onclick:()=>copy(data.script).then(()=>toast('Скрипт скопирован'))},'Копировать скрипт'),
          data.tunnel ? null : h('button',{onclick:()=>copy(`${data.upstream_user}:${data.upstream_pass}@HOST:${data.upstream_port}`)},'Копировать креды'),
          h('button',{onclick:()=>layer.remove()},'Закрыть')
        )
      )
    );
    document.body.append(layer);
  }catch(e){ toast(e.message||String(e), true); }
}

  );

function uploadSite(siteId){
  const inp = h('input',{type:'file',accept:'.html,.htm,.zip,text/html,application/zip',style:'display:none'});
  inp.onchange = async()=>{
    const f = inp.files?.[0]; if(!f) return;
    const fd = new FormData(); fd.append('file', f);
    try{
      const r = await fetch('/api/sites/'+encodeURIComponent(siteId)+'/upload',{method:'POST', body:fd, headers:{'X-Requested-With':'panel'}});
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.detail||('Ошибка '+r.status));
      toast('Загружено'); await refresh();
    }catch(e){ toast(e.message,true); }
  };
  document.body.append(inp); inp.click(); inp.remove();
}

        h('div',{class:'step'}, h('div',{class:'n'},'3'), h('div',{},h('b',{},'После изменений в панели'), h('div',{class:'hint',style:'margin:4px 0 0'},'Кнопка Reload выше — или caddy reload --config …')))
      ),
      h('div',{class:'row',style:'margin-top:12px'}, h('button',{onclick:()=>layer.remove()},'Закрыть'))
    )
  );
  document.body.append(layer);
}

async function refresh(){
  S = await api('GET','/api/state');
  // system flags may live under different key — tolerate
  if(!S.system) S.system = {sysctl:true,firewall:true,rate_limit:true};
  render();
}
async function start(){
  try{ await refresh(); poll = setInterval(()=>{ refresh().catch(()=>{}); }, 5000); }
  catch(e){ if(e.message!=='login') showLogin(); }
}
start();
</script>
